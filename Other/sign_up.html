<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Lilies</title>
    <style>
        /* Обнуляем отступы */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Главный контейнер на весь экран */
        .main-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Левая половина: Картинка с тостами + фильтр один-в-один как на Login */
        .left-side {
            flex: 1;
            background-image: url('images/Group 14.png');
            background-size: cover;
            background-position: center;
            height: 100%;
            filter: sepia(30%) brightness(90%); /* Точно такой же фильтр, как на первой странице */
        }

        /* Правая половина: Форма */
        .right-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;    
            background-color: #ffffff; /* Белый фон для самой секции */
            padding: 40px;
        }

        /* Блок с формой */
        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            color: #032424;
            font-size: 2.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        /* Поля ввода */
        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 1px solid #f0f0f0;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #1a202c;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input::placeholder {
            color: #bcbcbc;
        }

        .form-input:focus {
            border-color: #043333;
        }

        /* Кнопка show внутри инпута пароля */
        .show-password-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #1a202c;
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* Кнопка SIGN UP (Фирменный темно-зеленый цвет) */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #042424; 
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #021414;
        }

        /* Ссылка внизу */
        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #595959;
        }

        .footer-text a {
            color: #032424;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .left-side {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="left-side"></div>
    
    <div class="right-side">
        <div class="login-box">
            <h1 class="login-title">Welcome to Lilies!</h1>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="text" class="form-input" placeholder="Your First Name" required>
                </div>

                <div class="input-group">
                    <input type="email" class="form-input" placeholder="Your Email address" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password-field" class="form-input" placeholder="Your Password" required>
                    <button type="button" class="show-password-btn" onclick="togglePasswordVisibility()">show</button>
                </div>
                
                <button type="submit" class="submit-btn">SIGN UP</button>
                
                <p class="footer-text">Already have an account. <a href="log_in.html">LOGIN</a></p>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordField = document.getElementById('password-field');
        const toggleBtn = document.querySelector('.show-password-btn');
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleBtn.textContent = 'hide';
        } else {
            passwordField.type = 'password';
            toggleBtn.textContent = 'show';
        }
    }
</script>

</body>
</html>
