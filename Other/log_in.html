<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .left-side {
            flex: 1;
            background-image: url('images/Group 13.png');
            background-size: cover;
            background-position: center;
            height: 100%;
            filter: sepia(25%) brightness(90%) contrast(95%);
        }

        .right-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            color: #052929;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            color: #1a202c;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .form-input:focus {
            border-color: #052929;
        }

        .show-password-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #1a202c;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #042424;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #021414;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 0.95rem;
        }

        .footer-links a {
            color: #4a5568;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .left-side {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="left-side"></div>
    
    <div class="right-side">
        <div class="login-box">
            <h1 class="login-title">Welcome Back!</h1>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="email" class="form-input" placeholder="Your Email address" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password-field" class="form-input" placeholder="Your Password" required>
                    <button type="button" class="show-password-btn" onclick="togglePasswordVisibility()">show</button>
                </div>
                
                <button type="submit" class="submit-btn">LOGIN</button>
                
                <div class="footer-links">
                    <a href="sign_up.html">Create an account</a>
                    <a href="#">Forgot Password</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordField = document.getElementById('password-field');
        const toggleBtn = document.querySelector('.show-password-btn');
        
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleBtn.textContent = 'hide';
        } else {
            passwordField.type = 'password';
            toggleBtn.textContent = 'show';
        }
    }
</script>

</body>
</html>
